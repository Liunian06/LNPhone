name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          # 1. 注入一个看起来合法的虚拟 Team ID 到项目属性中
          # 这是绕过 Flutter 预检的关键。Flutter 会解析 pbxproj 寻找 DevelopmentTeam。
          # 我们使用 perl 确保替换的稳健性
          perl -i -pe 's/97C146ED1CF9000F007C117D = \{/97C146ED1CF9000F007C117D = \{ DevelopmentTeam = S8QB4VV633;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. 在构建设置中强制指定手动签名和虚拟 ID
          perl -i -pe 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.lnphone2;/PRODUCT_BUNDLE_IDENTIFIER = com.example.lnphone2; DEVELOPMENT_TEAM = S8QB4VV633; CODE_SIGN_STYLE = Manual; CODE_SIGNING_REQUIRED = NO; CODE_SIGNING_ALLOWED = NO;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 3. 同时也更新 xcconfig 确保环境一致
          echo "DEVELOPMENT_TEAM=S8QB4VV633" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          
          # 4. 执行构建
          # 使用 --no-codesign 告诉 Flutter 不要尝试签名
          flutter build ios --release --no-codesign

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload to IPA
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/\.//g' | tr -d ' ')
          FILENAME="汪汪机V${VERSION}.ipa"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # 将 Payload 目录压缩为 .ipa 文件
          zip -r -y "$FILENAME" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ env.IPA_FILENAME }}
