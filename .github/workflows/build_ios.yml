name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          # 1. 在 project.pbxproj 中强制注入虚拟 Team ID
          # Flutter 的预检脚本会直接读取 pbxproj 文件
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = 0000000000;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. 在 xcconfig 中彻底禁用签名逻辑
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Release.xcconfig
          
          # 3. 构建 iOS release 版本
          # 添加 -v 以便在失败时查看详细的 xcodebuild 日志
          flutter build ios --release --no-codesign -v

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload to IPA
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/\.//g' | tr -d ' ')
          FILENAME="汪汪机V${VERSION}.ipa"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # 将 Payload 目录压缩为 .ipa 文件
          zip -r -y "$FILENAME" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ env.IPA_FILENAME }}
