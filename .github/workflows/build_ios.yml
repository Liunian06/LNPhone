name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          # 1. 强制修改项目文件，移除自动签名并设置为手动签名
          # 这能防止 Flutter 检查 Development Team
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. 在 xcconfig 中注入禁用签名的指令
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = " >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE = " >> ios/Flutter/Release.xcconfig
          echo "PROVISIONING_PROFILE_SPECIFIER = " >> ios/Flutter/Release.xcconfig
          
          # 3. 构建 iOS release 版本
          # 使用 --no-codesign 告诉 Flutter 不要尝试签名
          flutter build ios --release --no-codesign

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload to IPA
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/\.//g' | tr -d ' ')
          FILENAME="汪汪机V${VERSION}.ipa"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # 将 Payload 目录压缩为 .ipa 文件
          zip -r -y "$FILENAME" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ env.IPA_FILENAME }}
