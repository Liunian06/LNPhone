name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          # 构建 iOS release 版本，开启混淆，但不进行签名
          flutter build ios --release --no-codesign --obfuscate --split-debug-info=build/symbols

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload to IPA
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/\.//g' | tr -d ' ')
          FILENAME="汪汪机V${VERSION}.ipa"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # 将 Payload 目录压缩为 .ipa 文件
          zip -r -y "$FILENAME" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ env.IPA_FILENAME }}
