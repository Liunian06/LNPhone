name: Build Unsigned iOS IPA

on:
  workflow_dispatch: # 允许手动触发构建

jobs:
  build-ios-unsigned:
    name: Build Unsigned iOS IPA
    runs-on: macos-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Release (No Codesign)
        run: |
          # 1. 确保在 project.pbxproj 的所有配置中都有 DEVELOPMENT_TEAM
          # 之前的 sed 可能因为匹配不到 CODE_SIGN_STYLE 而失败（Release 配置中默认没有该项）
          # 我们直接在 PRODUCT_BUNDLE_IDENTIFIER 后面插入
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = com.example.lnphone2;/PRODUCT_BUNDLE_IDENTIFIER = com.example.lnphone2; DEVELOPMENT_TEAM = 0000000000; CODE_SIGN_STYLE = Manual;/g' ios/Runner.xcodeproj/project.pbxproj
          
          # 2. 在 xcconfig 中彻底禁用签名逻辑
          echo "CODE_SIGNING_ALLOWED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED=NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY=" >> ios/Flutter/Release.xcconfig
          echo "DEVELOPMENT_TEAM=0000000000" >> ios/Flutter/Release.xcconfig
          
          # 3. 构建 iOS release 版本
          # 使用 --no-codesign 并在构建参数中再次强调禁用签名
          flutter build ios --release --no-codesign

      - name: Create Payload Directory
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/

      - name: Zip Payload to IPA
        run: |
          # Extract version from pubspec.yaml
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//' | sed 's/\.//g' | tr -d ' ')
          FILENAME="汪汪机V${VERSION}.ipa"
          echo "IPA_FILENAME=$FILENAME" >> $GITHUB_ENV
          
          # 将 Payload 目录压缩为 .ipa 文件
          zip -r -y "$FILENAME" Payload/

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_FILENAME }}
          path: ${{ env.IPA_FILENAME }}
