name: lnphone2
description: "AI Native Phone System - iOS Style Interface"
publish_to: 'none'

version: 1.6.6+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # iOS风格图标
  cupertino_icons: ^1.0.8
  
  # 国际化支持
  intl: ^0.20.2
  
  # 状态管理
  provider: ^6.1.2
  
  # 动画效果
  flutter_animate: ^4.5.2
  
  # 模糊效果增强
  blur: ^4.0.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  file_picker: ^10.3.8
  shared_preferences: ^2.3.5
  share_plus: ^12.0.1
  flutter_file_dialog: ^3.0.3
  archive: ^4.0.7
  http: ^1.6.0
  xml: ^6.5.0
  
  # 本地通知
  flutter_local_notifications: ^18.0.1

  # 数据库
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.26
  flutter_background_service: ^5.1.0
  permission_handler: ^12.0.1
  restart_app: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo.jpg"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icons/logo.jpg"
    backgroundColor: "#ffffff"
    themeColor: "#ffffff"
  macos:
    generate: true
    image_path: "assets/icons/logo.jpg"

flutter:
  uses-material-design: true
  
  assets:
    - assets/wallpapers/
    - assets/icons/
    - assets/prompts/
